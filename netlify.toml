# Netlify detects Next.js and runs it with its Next.js runtime (SSR via
# functions). Sitemap proxying and trailing-slash handling live in
# next.config.mjs.
[build]
  command = "npm run build"
  publish = ".next"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"
